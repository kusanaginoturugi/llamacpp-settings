version = 1

[*]
ui = false
# 5 分使われないモデルは眠らせて、VRAM を空ける（次のリクエストで数秒で起きる）。
# --models-max は個数しか見ないので、眠らせないと、ほかのプログラムが読み込んだモデルが VRAM に残り続けて、
# 次のモデルが読み込めなくなる。いつも使うモデルは、プリセットで -1（眠らせない）にする
sleep-idle-seconds = 300

[gemma-4-12b-it-qat-imatrix]
ui = true
hf = dahara1/gemma-4-12B-it-qat-UD-japanese-imatrix:UD-Q4_K_XL

n-gpu-layers = all
# 単独で約 7.9GB（32768 だと約 8.3GB で載らないことがある）。E4B と同時には載らない
ctx-size = 16384
parallel = 1

temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0

reasoning = off
no-mmproj = true

[vntl-llama3-8b-v2]
ui = true
hf = lmg-anon/vntl-llama3-8b-v2-gguf:Q8_0
chat-template-file = /home/onoue/src/llamacpp-settings/models/vntl-llama3-8b-v2.jinja
ctx-size = 16384
parallel = 4
n-gpu-layers = all
stop-timeout = 10
# 重み（Q8_0）だけで 8GB あり、このマシン（12GB）では whisper-server などと一緒には載らない

[Gemma-4-E4B-Uncensored]
ui = true
hf = HauhauCS/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive:Q4_K_M
chat-template-file = /home/onoue/src/llamacpp-settings/models/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive.jinja
# 長さを書かないと KV に 8GB 取ろうとして失敗する。16384 × 2 で約 4.3GB
ctx-size = 16384
parallel = 2
n-predict = 256
n-gpu-layers = all
flash-attn = on
no-warmup = true
temperature=1.0
#top_p=0.95
#top_k=64
mmproj=/home/onoue/.cache/huggingface/hub/models--HauhauCS--Gemma-4-E4B-Uncensored-HauhauCS-Aggressive/snapshots/45b6a334b4bcd1d7f37179df58b3b1d66a184e5d/mmproj-Gemma-4-E4B-Uncensored-HauhauCS-Aggressive-f16.gguf

[gemma-4-12B-QAT-Uncensored]
ui = true
hf = unsloth/gemma-4-12B-it-qat-GGUF:UD-Q4_K_XL
chat-template-file = /home/onoue/src/llamacpp-settings/models/Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced.jinja
# 長さを書かないと載らない。16384 × 1 で約 7.8GB。E4B と同時には載らない
ctx-size = 16384
parallel = 1
n-predict = 256
n-gpu-layers = all
flash-attn = on
no-warmup = true
spec-type = draft-mtp
spec-draft-n-max = 4
temperature=1.0

[gemma-4-12B-it-qat]
ui = true
hf = unsloth/gemma-4-12B-it-qat-GGUF:UD-Q4_K_XL
# 長さを書かないと載らない。16384 × 1 で約 7.8GB。E4B と同時には載らない
ctx-size = 16384
parallel = 1
n-predict = 256
n-gpu-layers = all
flash-attn = on
no-warmup = true
spec-type = draft-mtp
spec-draft-n-max = 4
temperature=1.0
#top_p=0.95
#top_k=64

[gemma-4-E4B-it]
ui = true
hf = unsloth/gemma-4-E4B-it-GGUF:Q4_K_M
chat-template-file = /home/onoue/src/llamacpp-settings/models/gemma-4-E4B-it-GGUF.jinja
n-gpu-layers = all
# Whisper（medium 約 2GB）と Laya（約 0.6GB）を載せたまま、VRAM が 1GB ほど残る長さ
ctx-size = 196608
parallel = 4
stop-timeout = 10
spec-type = draft-mtp
spec-draft-n-max = 2
temperature=1.0
#top_p=0.95
#top_k=64

[gemma-4-E4B-it-qat]
# voice-input の清書の既定。ggml-org が QAT 版（qat-q4_0-unquantized）から変換した Q4_0
ui = true
hf = ggml-org/gemma-4-E4B-it-GGUF:Q4_0
no-mmproj = true
n-gpu-layers = all
# いつも載せておくので小さめに。32768 × 2 で約 3.7GB（131072 × 4 だと約 5.3GB）。
# 1 枠 16384 トークンあれば清書と voice-chat には足りて、translategemma-4b などを並べて載せられる
ctx-size = 32768
parallel = 2
stop-timeout = 10
spec-type = draft-mtp
spec-draft-n-max = 2
# voice-input と voice-chat ですぐ返事したいので、眠らせない
sleep-idle-seconds = -1

[ornith-1.0-9b]
ui = true
hf-repo = deepreinforce-ai/Ornith-1.0-9B-GGUF
hf-file = ornith-1.0-9b-Q4_K_M.gguf
chat-template-file = /home/onoue/src/llamacpp-settings/models/Ornith-1.0-9B-GGUF.jinja
n-gpu-layers = all
# 16384 で約 5.5GB（65536 だと約 7.1GB）
ctx-size = 16384
parallel = 1
stop-timeout = 10

#
# Translate Models
#
[translategemma-4b]
ui = true
hf = mradermacher/translategemma-4b-it-GGUF:Q4_K_M
chat-template-file = /home/onoue/src/llamacpp-settings/models/gemma.jinja
ctx-size = 16384
parallel = 4
n-gpu-layers = all
stop-timeout = 10

[Hy-MT2-7B-GGUF]
ui = false
hf = unsloth/Hy-MT2-7B-GGUF:Q4_K_M
# 長さを書かないと載らない。8192 × 2 で約 5.6GB
ctx-size = 8192
parallel = 2
# モデルカードの推奨値。models.ini のキーは llama-server の起動オプション名（API の top_p などとは名前が違う）
temperature = 0.7
top-p = 0.6
top-k = 20
repeat-penalty = 1.05
n-predict = 4096

#
# Dicision Models
#
[laya-q8]
# voice-input-judge の採点用。CPU で動かす
ui = false
hf = ggml-org/Laya-GGUF:Q8_0
n-gpu-layers = 0
batch-size = 512
ubatch-size = 512
# CPU で動かす小さいモデルで、VRAM は使わないので眠らせない
sleep-idle-seconds = -1
